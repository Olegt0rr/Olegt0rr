name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT_TOKEN }}

      # ─── Stats: light ───
      - name: Generate stats card (light)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=Olegt0rr&show_icons=true&count_private=true&include_all_commits=true&theme=default
          path: profile/stats-light.svg
          token: ${{ secrets.PAT_TOKEN }}

      # ─── Stats: dark ───
      - name: Generate stats card (dark)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=Olegt0rr&show_icons=true&count_private=true&include_all_commits=true&theme=tokyonight
          path: profile/stats-dark.svg
          token: ${{ secrets.PAT_TOKEN }}

      # ─── Top languages: light ───
      - name: Generate top languages card (light)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=Olegt0rr&layout=compact&langs_count=8&theme=default
          path: profile/top-langs-light.svg
          token: ${{ secrets.PAT_TOKEN }}

      # ─── Top languages: dark ───
      - name: Generate top languages card (dark)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=Olegt0rr&layout=compact&langs_count=8&theme=tokyonight
          path: profile/top-langs-dark.svg
          token: ${{ secrets.PAT_TOKEN }}

      # ─── Activity graph: light + dark ───
      # The public instance (github-readme-activity-graph.vercel.app) has been
      # returning HTTP 402 (Vercel quota) since 2026-08-25. Run the upstream
      # renderer locally with the same query parameters instead.
      - name: Checkout activity-graph renderer
        uses: actions/checkout@v7
        with:
          repository: Ashutosh00710/github-readme-activity-graph
          ref: 0962e9461de815933d462e8b98c7ce566cada8fb # main, 2026-05-17
          path: .activity-graph

      - name: Setup Node.js for activity-graph renderer
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .activity-graph/package-lock.json

      # Build without secrets in the environment; only the renderer process
      # below gets the PAT.
      - name: Build activity-graph renderer
        working-directory: .activity-graph
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Generate activity graph (light + dark)
        env:
          TOKEN: ${{ secrets.PAT_TOKEN }}
          PORT: 5100
        run: |
          set -euo pipefail
          cleanup() {
            rc=$?
            [ -f renderer.pid ] && kill "$(cat renderer.pid)" 2>/dev/null || true
            if [ "$rc" -ne 0 ] && [ -f renderer.log ]; then
              echo "--- renderer log ---"; cat renderer.log
            fi
            rm -rf .activity-graph renderer.pid renderer.log
          }
          trap cleanup EXIT

          (cd .activity-graph && exec node dist/main.js) > renderer.log 2>&1 &
          echo $! > renderer.pid

          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null "http://localhost:$PORT/" 2>/dev/null && break
            sleep 1
          done
          if ! curl -fsS -o /dev/null "http://localhost:$PORT/"; then
            echo "::error::activity-graph renderer did not become reachable on port $PORT"
            exit 1
          fi

          mkdir -p profile
          curl -fsSL --retry 3 --retry-delay 5 \
            -o profile/activity-graph-light.svg \
            "http://localhost:$PORT/graph?username=Olegt0rr&theme=minimal&hide_border=true&area=true&radius=8"
          curl -fsSL --retry 3 --retry-delay 5 \
            -o profile/activity-graph-dark.svg \
            "http://localhost:$PORT/graph?username=Olegt0rr&theme=tokyo-night&hide_border=true&area=true&radius=8"

      - name: Validate generated cards
        run: |
          # github-readme-stats: "Something went wrong! ..." + details in <tspan>
          # activity-graph:      invalidUserSvg() texts (returned with HTTP 200)
          pattern="Something went wrong|Something unexpected happened|Can't fetch any contribution|API rate limit exceeded"
          status=0
          for f in profile/*.svg; do
            if grep -qE "$pattern" "$f"; then
              msg=$(sed -nE 's/.*<tspan[^>]*>([^<]+)<\/tspan>.*/\1/p' "$f" | grep -vx 'OK' | head -n 1)
              [ -n "$msg" ] || msg=$(grep -oE "[^>]*($pattern)[^<]*" "$f" | head -n 1 | sed -E 's/^[[:space:]]+//')
              [ -n "$msg" ] || msg="error text matched but could not be extracted"
              # workflow-command message: strip CR/LF, escape %
              msg=$(printf '%s' "$msg" | tr -d '\r\n' | sed 's/%/%25/g')
              echo "::error file=$f::$f is broken: $msg"
              status=1
            fi
          done
          exit $status

      - name: Commit cards
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Update README cards
          file_pattern: profile/*.svg
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
